# Ground UNO Q MCU (Arduino UNO Q 4 GB, ABX00173: STM32U585, Arduino core on Zephyr;
# D-71). FQBN: arduino:zephyr:unoq. App Lab and arduino-cli always build the default
# profile below with the arduino:zephyr core installed on the board's App Lab (0.90.0 on
# older installations, 1.0.0 and later otherwise: the sketch builds and loads on both).
# Station I/O: one CardKB on the header SDA / SCL pins (Wire), annunciator LEDs / buzzer,
# the ground link status on the LED matrix, the Radio Control Unit for the UART E22 and,
# optionally, the SX126x ground radio (pin plan H, D-72: sketch.ino).
# Wire, SPI and Arduino_LED_Matrix ship with arduino:zephyr. Two libraries are bundled
# here, never downloaded by the board (the App Lab package contains them):
#  * RadioLib 7.8.1 for the SX126x option (sketch.ino: #define DSSQ_RADIO_SX126X 1):
#    tools/radiolib.py fetches the release (tag commit verified), applies
#    tools/radiolib-7.8.1.patch and writes libraries/RadioLib (contract 25.2 / 30). The
#    default E22 build never includes RadioLib.h, so arduino-cli stages the library but
#    compiles none of it.
#  * Arduino_RouterBridge 0.4.3, the release arduino:zephyr ships, patched by
#    tools/arduino_routerbridge-0.4.3.patch (bridge thread stack 1536 octets; provide_safe
#    handlers only on the loop thread) and written by tools/routerbridge.py to
#    libraries/Arduino_RouterBridge (contract 41). arduino-cli uses it instead of the
#    platform's copy; its dependencies (Arduino_RPClite, MsgPack, ...) still come from
#    the platform.
# arduino-cli rejects a profile whose "dir:" does not exist, so before building from
# the repository run (from the repository root; the App Lab zip already contains both)
#   python3 tools/radiolib.py fetch dssq-groundstation/sketch/libraries/RadioLib
#   python3 tools/routerbridge.py fetch dssq-groundstation/sketch/libraries/Arduino_RouterBridge
profiles:
  default:
    fqbn: arduino:zephyr:unoq
    platforms:
      - platform: arduino:zephyr
    libraries:
      - dir: libraries/RadioLib
      - dir: libraries/Arduino_RouterBridge
default_profile: default
