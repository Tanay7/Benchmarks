# VENTUNO Q MCU (STM32H5F5, Arduino core on Zephyr). FQBN: arduino:zephyr:ventunoq
# Station I/O: one CardKB on the header I2C pins, annunciator LEDs / buzzer, Radio
# Control Unit for the UART E22 and, optionally, the SX126x ground radio.
# Wire, SPI and Arduino_RouterBridge ship with arduino:zephyr. The one library listed
# is RadioLib 7.8.1 for the SX126x option (sketch.ino: #define DSSQ_RADIO_SX126X 1).
# The board never downloads it: tools/radiolib.py fetches the release (tag commit
# verified), applies tools/radiolib-7.8.1.patch and writes the copy that the App Lab
# package bundles here (contract 25.2 / 30). arduino-cli rejects a profile whose
# "dir:" does not exist, so before building from the repository run
#   python3 tools/radiolib.py fetch ground/station_io/sketch/libraries/RadioLib
# The default E22 build never includes RadioLib.h, so arduino-cli stages the library
# but compiles none of it.
profiles:
  default:
    fqbn: arduino:zephyr:ventunoq
    platforms:
      - platform: arduino:zephyr
    libraries:
      - dir: libraries/RadioLib
default_profile: default
