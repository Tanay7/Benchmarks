# =============================================================================
#  DSS-Q1 ground station configuration (VENTUNO Q or any Linux PC)
#
#  Every key below is also the built-in default (ground/dssq/config.py DEFAULTS mirrors
#  this file); a table you write replaces only the keys it names, nested tables included.
#  The station refuses to start on an invalid value and names the key.
#  The [radio] values MUST match spacecraft/vgq1_flight/sketch/src/config.h.
#  App Lab: the App copies this file once to <App>/data/station.toml - edit that copy.
# =============================================================================

[station]
name = "DSS-Q1"
latitude_deg = 0.0          # your station - used for OWLT / range when known
longitude_deg = 0.0
altitude_m = 0.0
antenna = "433 MHz Yagi"
antenna_gain_dbi = 12.0     # use the MEASURED / datasheet gain, not marketing figures
rx_line_loss_db = 1.0       # coax + connectors between antenna and radio (also used for the uplink)

[spacecraft]
name = "VGQ-1"
scid = 0x0A7
distance_km = 0.0           # enter the measured path length for OWLT / link budget
antenna_gain_dbi = 2.15     # spacecraft antenna (half-wave dipole / whip ~ 2 dBi)
tx_line_loss_db = 0.5

[radio]
# Station radio model: "E22-400T33D" (default, EBYTE UART module on a USB-UART),
# "E22-400T37S" (5 W module on the E22-400TBH-02 board, preserved option) or "SX126x"
# (SX1268 / SX1262 over SPI on the VENTUNO Q MCU, via RadioLib; build switch
# DSSQ_RADIO_SX126X = 1 of the station sketch). Both ends must use the same model.
# "auto" (or no model line at all): an E22 station that follows the E22 model the
# spacecraft reports in its RF packet - the flight software reads the T33D / T37S
# choice from a jumper at boot (contract 33), so neither end needs an edit. The
# station's own module registers then follow the T33D rules (the T37S abnormal-status
# log is enabled only with model = "E22-400T37S" here).
model = "E22-400T33D"
port = "/dev/ttyUSB0"       # E22 models only: the USB-UART (check with: ls /dev/serial/by-id/)
address = 0
netid = 0
uart_code = 3               # E22: MUST be 3 = 9600 bit/s (CONFIG mode is always 9600 8N1)
parity = 0
# ---- Rate code ---------------------------------------------------------------
#  E22 models (REG0 air rate, manuals 7.2): codes 0, 1, 2 are ALL 2.4 kbit/s - the
#    slowest and most sensitive setting (T33D -128 dBm typ, T37S -126 dBm typ);
#    3 = 4.8k, 4 = 9.6k, 5 = 19.2k, 6 = 38.4k, 7 = 62.5k. Default 2.
#  SX126x: LoRa profile 0..7 (0 SF12/31.25 kHz ... 7 SF7/125 kHz, CR 4/5); set 1
#    (SF12 / 62.5 kHz, the flight's SX126x default kRadioRateCode).
#  Change it here AND in config.h (kRadioRateCode), or use the LINKRATE directive.
air_rate = 2
subpacket = 0               # E22: 240-octet sub-packets (one CADU = one LoRa packet)
rssi_noise = true           # E22: enables the C0 C1 C2 C3 ambient-noise queries
fault_log = false           # E22-400T37S only (FF FF FF 0x under/over-voltage, over-temperature
                            # reports); ignored on the T33D, whose REG1 b4..b2 are reserved
# ---- Power code (ground transmitter, 0..3; the meaning depends on the model) ----
#  E22-400T33D 33 / 30 / 27 / 24 dBm (codes 1..3 VERIFY: docs/08 T-RF-07)
#  E22-400T37S 37 dBm for every code (the module has no power levels)
#  SX126x      chip drive 22 / 17 / 14 / 10 dBm + [radio.sx126x] pa_gain_db (module max 33 dBm)
power = 0
channel = 23                # 410.125 + 23 = 433.125 MHz - check your band plan / licence
rssi_byte = true            # E22 appends packet RSSI to every received packet
fixed = false               # E22 REG3: transparent transmission (fixed-point mode off)
relay = false               # E22 REG3: relay function off
wor_role = false            # E22 REG3: WOR receiver role (the GDS switches to transmitter for WAKE)
wor_cycle = 0               # E22 REG3: WOR cycle code 0..7
lbt = false                 # E22: listen-before-talk on uplink (SX126x: [radio.sx126x] cad_before_tx)
noise_bw_hz = 125000.0      # E22: ASSUMED noise bandwidth for C/N0 estimates (SX126x: the profile BW)
noise_poll_s = 20.0         # ambient-noise sample period, s (>= 5)
radio_latency_s = 0.0       # calibrated radio pipeline delay for time correlation (VERIFY T-TM-04)
rssi_cal_offset_db = 0.0    # added to every RSSI / noise reading (calibrate: docs/08 T-RF-02)
# Channels YOU may use (licence + band plan). Grid: 410.125 + CH MHz.
# Default 20..24 = 430.125..434.125 MHz (70 cm amateur band, Region 1/3; avoids the
# 435-438 MHz satellite segment). US (Region 2, 420-450 MHz) operators can widen it.
# CHANNEL / LINKCHAN outside this list are refused by the GDS.
allowed_channels = [20, 21, 22, 23, 24]
freq_offset_cal_hz = 0.0    # SX126x: static TX-RX crystal offset, Hz (+-50000); AFC start value
freq_offset_calibrated = false  # true only after the T-RF frequency calibration; the TDM carries
                                # DOPPLER_INSTANTANEOUS only when true

[radio.sx126x]
chip = "SX1268"             # or "SX1262"
tcxo_v = 1.8                # module TCXO supply on DIO3, V (0 = crystal); VERIFY the module datasheet
rx_boosted_gain = true      # register 0x08AC = 0x96 (DS Table 9-3), read back and verified
cad_before_tx = true        # channel-activity detection before every uplink
sync_word = 0x12            # must equal the flight kSxSyncWord
preamble = 12               # must equal the flight kSxPreambleSym
pa_gain_db = 11.0           # module PA gain after the chip (reference E22-400M33S), 0..20; VERIFY T-RF-07
afc = true                  # ground automatic frequency correction (contract 24.8)

[radio.sensitivity_measured]
# Only from docs/08 test T-RF-03 (python3 tools/link_budget.py sensitivity ...), e.g.
# "E22-400T33D:2" = -127.5

[link]
tm_framing = "auto"         # downlink: "auto" (per frame), "TM" (132.0-B-3) or "USLP" (732.1-B-2)
tc_framing = "TC"           # uplink: "TC" (232.0-B-4) or "USLP". SEQLOAD and MAGCAL (26-octet
                            # packets) do not fit a 64-octet USLP + AE frame: keep "TC" for them

[sdls]
# Space Data Link Security (355.0-B-2). Services: tc NONE | AUTH | AE, tm NONE | AE.
# Without the key file both ends run NONE and say so (YELLOW alarm while a service is set).
# Regulatory: encryption is generally NOT permitted on amateur frequencies - use AUTH or NONE
# there (docs/09). Create the key for BOTH ends with tools/gen_sdls_key.py.
tc_service = "AE"
tm_service = "AE"
key_file = "config/sdls_key.hex"   # host: relative to the working directory (ground/);
                                   # App Lab: always <App>/data/sdls_key.hex unless absolute
spi = 1                     # AUTH SPI (= flight VGQ_SDLS_SPI); AE uses SPI 2 (TC) / 3 (TM)
accept_null = true          # accept the flight's null-SA fallback frames, flagged UNPROTECTED

[cfdp]
inactivity_s = 600.0        # no PDU for this long: transaction ABANDONED
check_s = 60.0              # late File Data accepted this long after an EOF with gaps
files_dir = "files"         # received files: <archive_dir>/files
max_file_mib = 64           # largest file the receiver accepts

[spectral]
white_ref_file = "spec_white_ref.json"   # under archive_dir
library_file = "spec_library.json"       # under archive_dir

[spectral.classifier]
# light-source classifier threshold overrides (dssq.spectral.ClassThresholds field = value)

[science]
r_outboard_m = 1.0          # boom distance of the outboard RM3100 from the bus centre
r_inboard_m = 0.5           # boom distance of the inboard RM3100
# field_ut = 49.5           # site total magnetic field (WMM), uT: needed by the MAGCAL fit
                            # (no default on purpose: the fit is refused without it)

[tdm]
auto_write = true           # write the pass's CCSDS Tracking Data Message at LOS

[linkmgr]
mode = "ADVISE"             # OFF | ADVISE | AUTO
target_margin_db = 6.0
period_s = 60.0
holdoff_s = 600.0
# min_rate = 2              # absent = the radio model's slowest distinct code: E22 2 (codes 0-1
                            # are aliases of 2.4k), SX126x 0 (profile 0, the most sensitive)
max_rate = 4
revert_s = 180              # spacecraft auto-revert window for coordinated changes (60..3600)

[interop]
tm_frames_udp = ""          # e.g. "127.0.0.1:10015" -> YAMCS / OpenC3 TM frame link
tm_packets_udp = ""         # e.g. "127.0.0.1:10016" -> packet link
tc_frames_udp_listen = ""   # e.g. "127.0.0.1:10025" <- TC frames from an external MCS

[gds]
archive_dir = "archive"     # host: relative to the working directory; App: under <App>/data
http_host = "127.0.0.1"     # 0.0.0.0 exposes the dashboard (and COMMANDING) to your LAN
http_port = 8080
http_token = ""             # REQUIRED if http_host is not loopback (X-DSSQ-Token header);
                            # the App creates one in <App>/data/http_token
http_allowed_hosts = []     # LAN server: DNS names (no port) the dashboard may be reached by, besides
                            # IP addresses, single-label and <name>.local names (DNS-rebinding guard)
los_timeout_s = 90.0        # minimum; the GDS uses max(this, 3 x the spacecraft frame period)
frontpanel = true           # VENTUNO Q MCU station I/O (CardKB, LEDs, buzzer) via arduino-router
rcu = true                  # VENTUNO Q MCU drives the ground E22 M0/M1/AUX (jumpers removed)
router_address = ""         # host default unix:///var/run/arduino-router.sock; App: APP_SOCKET
console_interval_s = 10.0
# ---- Receiver data logger: retention and free-space guard (contract 39) ----------
# The archive (archive_dir above) holds YYYYMMDD/ UTC day folders (cadu.bin, events.log),
# gds.sqlite (frames, packets, params, events, commands and the 1 Hz rx_stats receiver
# series) and exports/ (CSV from: python -m dssq.export, or the FILES tab).
# VENTUNO Q (App Lab): <App>/data/archive = /home/arduino/ArduinoApps/<App>/data/archive on
# the 64 GB eMMC. An ABSOLUTE archive_dir puts it elsewhere, e.g. an external M.2 2230 NVMe
# or a USB 3.0 drive - only when that path is visible INSIDE the App container (VERIFY on
# the hardware); the host CLI (python -m dssq.gds) has no such restriction.
archive_keep_days = 180     # day folders and rx_stats / params / frames rows older than this many
                            # days are deleted, oldest first (0 = no age limit); never the current
                            # UTC day. exports/ files older than this go too
archive_max_gb = 16.0       # size cap of day folders + database pages in use, GB = 1e9 octets
                            # (0 = no cap): over it, the oldest day is pruned, one day per minute
archive_min_free_mb = 2048.0  # free-space floor of the archive's file system, MB = 1e6 octets
                            # (0 = guard off): below it, raw CADU and rx_stats logging pause
                            # (WARN event, YELLOW alarm) and resume by themselves above it + 5 %

[commanding]
t1_s = 45.0                 # FOP-1 retransmission timer (minimum; >= 2 x the frame period is used)
tx_limit = 3                # transmissions per AD frame before suspending
window = 5                  # max outstanding AD frames
verify_timeout_s = 300.0    # minimum; >= 4 x the frame period is used
require_two_person_for_hazardous = false   # true: a second operator authorises with the web AUTH button
auth_token = ""             # when set, AUTH also needs the X-DSSQ-Auth header (second operator's secret)
